<!DOCTYPE html>
<!-- LOGIN — AdminLTE 2.4.18 (pages/examples/login.html asosida). Master layoutdan meros OLMAYDI. -->
<html lang="[[LANG]]">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Kirish | [[APP_NAME]]</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/icheck@1.0.2/skins/square/blue.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@2.4.18/dist/css/AdminLTE.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,600,700&display=swap">
  <link rel="stylesheet" href="[[ASSET_URL]]/admin.css">
</head>
<body class="hold-transition login-page">
<div class="login-box">
  <div class="login-logo">
    <a href="[[HOME_URL]]"><b>[[APP_NAME]]</b></a>
  </div>
  <div class="login-box-body">
    <p class="login-box-msg">Tizimga kirish</p>

    <!-- Xato bo'lsa: -->
    <!-- <div class="alert alert-danger"><i class="icon fa fa-ban"></i> [[ERROR]]</div> -->

    <form action="[[LOGIN_URL]]" method="post">
      [[CSRF_FIELD]]
      <div class="form-group has-feedback [[EMAIL_ERROR_CLASS]]">
        <input type="email" name="email" class="form-control" placeholder="Email" value="[[OLD_EMAIL]]" required autofocus autocomplete="username">
        <span class="glyphicon glyphicon-envelope form-control-feedback"></span>
        <!-- <span class="help-block">[[EMAIL_ERROR]]</span> -->
      </div>
      <div class="form-group has-feedback">
        <input type="password" name="password" class="form-control" placeholder="Parol" required autocomplete="current-password">
        <span class="glyphicon glyphicon-lock form-control-feedback"></span>
      </div>
      <div class="row">
        <div class="col-xs-7">
          <div class="checkbox icheck">
            <label><input type="checkbox" name="remember" class="icheck"> Meni eslab qol</label>
          </div>
        </div>
        <div class="col-xs-5">
          <button type="submit" class="btn btn-primary btn-block btn-flat">Kirish</button>
        </div>
      </div>
    </form>

    <a href="[[FORGOT_URL]]">Parolni unutdingizmi?</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/js/bootstrap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/icheck@1.0.2/icheck.min.js"></script>
<script src="[[ASSET_URL]]/admin.js"></script>
</body>
</html>
